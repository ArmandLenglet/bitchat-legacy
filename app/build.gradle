apply plugin: 'com.android.application'

android {
    namespace 'free.bitchat.legacy'
    compileSdk 33

    defaultConfig {
        applicationId "free.bitchat.legacy"
        minSdkVersion 14
        targetSdkVersion 22
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
            // Pas de signature ici : la CI produit un APK debug.
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// Aucune dépendance externe : tout repose sur le framework Android.
dependencies {
}
